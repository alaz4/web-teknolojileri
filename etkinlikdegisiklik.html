<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlik Portalı</h1>
        <nav>
            <ul>
            <li><a href="index.html">Ana Sayfa</a></li>
            <li><a href="etkinlikler.html">Etkinlikler</a></li>
            <li><a href="etkinlikdegisikligi.html">Etkinlik Ekle</a></li>
        </ul>
        </nav>
    </header>
    <hr>
    <main>
        <h1>Etkinlik Ekle</h1>
        <hr>
        <form>
        <p>
            <input type="text" name="etkinlik_adi" placeholder="Etkinlik Adını Giriniz">
        </p>
        <h2>Tarih ve Saat</h2>
        <p>
            <label>Tarih:</label>
            <input type="date" name="tarih">
            <br><br>
            <label>Saat:</label>
            <input type="time" name="saat">
        </p>
        <h2>Açıklama</h2>
        <p>
            <textarea name="aciklama" rows="5" cols="40" placeholder="Etkinlik Açıklamasını BUraya Yazınız"></textarea>
        </p>
        <p>
            <button type="submit">Kaydet</button>
        </p>
    </form>
    <hr>
    <p>
        <a href="index.html">&rarr; Ana Sayfaya Dön</a>
    </p>
    </main>
</body>
</html>
