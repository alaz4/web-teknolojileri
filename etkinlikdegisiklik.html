<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="2416501004.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlik Portalı</h1>
        <nav>
    <ul>
        <li><a href="index.html" class="nav-link">Ana Sayfa</a></li>
        <li><a href="etkinlikler.html" class="nav-link">Etkinlikler</a></li>
        <li><a href="etkinlikdegisiklik.html" class="nav-link">Etkinlik Ekle</a></li>
    </ul>
</nav>
    </header>
    <hr>
    <main>
    <h1 class="alti-cizili">Etkinlik Ekle</h1>
    <hr>

    <form id="etkinlik-formu" data-mode="guncelle" novalidate>
        <div>
            <label for="ad">Etkinlik Adı:</label>
            <input type="text" id="ad" name="ad">
            <span id="ad-hata" class="hata-mesaji"></span>
        </div>

        <div>
            <label for="kategori">Kategori:</label>
            <select id="kategori" name="kategori">
                <option value="">Seçiniz</option>
                <option value="Atölye">Atölye</option>
                <option value="Seminer">Seminer</option>
                <option value="Konser">Konser</option>
            </select>
            <span id="kategori-hata" class="hata-mesaji"></span>
        </div>

        <div>
            <label for="tarih">Tarih:</label>
            <input type="date" id="tarih" name="tarih">
            <span id="tarih-hata" class="hata-mesaji"></span>
        </div>

        <div>
            <label for="saat">Saat:</label>
            <input type="time" id="saat" name="saat">
            <span id="saat-hata" class="hata-mesaji"></span>
        </div>

        <div>
            <label for="mekan">Mekan:</label>
            <input type="text" id="mekan" name="mekan">
            <span id="mekan-hata" class="hata-mesaji"></span>
        </div>

        <div>
            <label for="kontenjan">Kontenjan:</label>
            <input type="number" id="kontenjan" name="kontenjan">
            <span id="kontenjan-hata" class="hata-mesaji"></span>
        </div>

        <div>
            <label for="aciklama">Açıklama:</label>
            <textarea id="aciklama" name="aciklama" rows="4"></textarea>
            <span id="aciklama-hata" class="hata-mesaji"></span>
        </div>

        <button type="submit" class="btn-detail" style="margin-top: 15px;">Kaydet</button>
        
        <!-- Genel Form Mesaj Kutusu -->
        <div id="form-mesaj" style="margin-top: 15px;"></div>
    </form>
</main>
</body>
</html>
